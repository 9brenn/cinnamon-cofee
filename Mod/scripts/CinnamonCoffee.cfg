// deviceToken: your Autoblow API device token.
// This is included in every UDP message sent to the bridge (port 28777).
// The bridge reads it from the message, so you only need to configure it here.
// Leave blank if you prefer to set DEVICE_TOKEN as an environment variable on the bridge.
