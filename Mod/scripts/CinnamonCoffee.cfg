// strokeMin: device stroke lower bound (0–100). Default 5. Lower = deeper insertion at low speeds.
// strokeMax: device stroke upper bound (0–100). Default 65. Higher = more retracted at low speeds.
// Both values are sent in every UDP message so the bridge derives the full motion range from them.
// The park position for ready/finish is always strokeMax (retracted). Defaults match the prior hardcoded values.
strokeMin=5
strokeMax=65

// readyAndFinishDelay: how long (in milliseconds) the device oscillates at the top park position when parking
// (both on Services open and after a natural finish) before fully stopping. Default 2000 (2 seconds).
